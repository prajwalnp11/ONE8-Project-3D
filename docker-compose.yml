services:
  backend:
    build: ./backend
    container_name: one8-backend
    env_file:
      - ./backend/.env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - one8-db-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: one8-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  one8-db-data:
    external: true
    name: one8-db-data
